<meta charset="utf-8">
<title>Soft Pickup Planet</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600&family=Nunito:wght@600;700;800&display=swap">
<style>
/* Layout: full-screen chase view over a tiny planet; frosted settings card top-left, speedometer bottom-centre, touch pad on phones. Single pastel look by choice. */
:root{
  --sky:#CFE6F5; --panel:rgba(255,252,248,.9); --ink:#3A3550; --muted:#777190; --line:#E5DFEC;
  --chip:#F2EDF6; --focus:#8FC7E8;
  --display:"Fredoka","Arial Rounded MT Bold","Trebuchet MS",sans-serif;
  --body:"Nunito","Segoe UI",system-ui,sans-serif;
  color-scheme:light;
}
html,body{height:100%;overflow:hidden}
body{background:var(--sky);color:var(--ink);font-family:var(--body);font-size:15px;line-height:1.45}
#c{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:none;outline:none}

.panel{position:fixed;top:calc(14px + env(safe-area-inset-top,0px));left:14px;width:270px;max-width:calc(100% - 28px);
  background:var(--panel);-webkit-backdrop-filter:blur(12px);backdrop-filter:blur(12px);border-radius:20px;
  box-shadow:0 14px 40px -20px rgba(58,53,80,.45)}
.panel summary{list-style:none;cursor:pointer;display:flex;align-items:center;justify-content:space-between;gap:10px;padding:14px 16px}
.panel summary::-webkit-details-marker{display:none}
.panel summary h1{font-family:var(--display);font-weight:600;font-size:22px;line-height:1;margin:0}
.panel summary span{font-size:12px;font-weight:800;color:var(--muted);letter-spacing:.06em;text-transform:uppercase}
.panel[open] summary span::after{content:" ▲"} .panel:not([open]) summary span::after{content:" ▼"}
.pbody{padding:0 16px 16px;display:flex;flex-direction:column;gap:12px}
.group{display:flex;flex-direction:column;gap:7px}
.label{font-size:11px;font-weight:800;letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
.seg{display:flex;flex-wrap:wrap;gap:6px}
.seg button{font:inherit;font-weight:700;font-size:14px;border:0;background:var(--chip);color:var(--ink);padding:6px 13px;border-radius:999px;cursor:pointer}
.seg button[aria-pressed="true"]{background:var(--ink);color:#FFFFFF}
.sw{display:flex;flex-wrap:wrap;gap:8px}
.sw button{width:30px;height:30px;border-radius:50%;border:3px solid #FFFFFF;box-shadow:0 0 0 1px var(--line);cursor:pointer;padding:0}
.sw button[aria-pressed="true"]{box-shadow:0 0 0 2.5px var(--ink)}
button:focus-visible{outline:3px solid var(--focus);outline-offset:2px}
.hint{margin:0;font-size:13px;color:var(--muted)}
.hint kbd{font-family:var(--body);font-weight:800;font-size:12px;background:var(--chip);border-radius:6px;padding:1px 6px;color:var(--ink)}

.speedo{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(14px + env(safe-area-inset-bottom,0px));
  background:var(--panel);border-radius:999px;padding:6px 18px 6px 20px;display:flex;align-items:baseline;gap:6px;
  box-shadow:0 10px 30px -18px rgba(58,53,80,.5);pointer-events:none}
.speedo b{font-family:var(--display);font-weight:600;font-size:26px;font-variant-numeric:tabular-nums;min-width:2.2ch;text-align:right}
.speedo small{font-weight:800;font-size:12px;color:var(--muted)}
.speedo i{font-style:normal;font-weight:800;font-size:12px;color:var(--muted);margin-left:10px;padding-left:10px;border-left:2px solid var(--line)}

.pad{position:fixed;inset:auto 0 calc(70px + env(safe-area-inset-bottom,0px)) 0;padding:0 16px;display:none;justify-content:space-between;pointer-events:none}
.pad div{display:flex;gap:10px}
.pad button{pointer-events:auto;width:64px;height:64px;border-radius:50%;border:0;background:var(--panel);color:var(--ink);font:800 22px var(--body);
  box-shadow:0 8px 20px -10px rgba(58,53,80,.5);touch-action:none;user-select:none;-webkit-user-select:none}
@media (pointer:coarse){.pad{display:flex}}

.msg{position:fixed;inset:0;display:grid;place-items:center;padding:24px;text-align:center;font-family:var(--display);font-size:20px;color:var(--ink)}
@media (max-width:640px){.panel{width:auto;right:14px}}
</style>

<canvas id="c" tabindex="0" aria-label="A cute pickup truck driving around a tiny round planet"></canvas>
<div class="msg" id="msg">Loading the planet…</div>

<details class="panel" id="panel" open>
  <summary><h1>Soft Pickup Planet</h1><span>Settings</span></summary>
  <div class="pbody">
    <div class="group"><span class="label">Camera</span><div class="seg" id="cam"></div></div>
    <div class="group"><span class="label">Truck colour</span><div class="sw" id="color"></div></div>
    <div class="group"><span class="label">Zoom</span><div class="seg" id="zoom"><button type="button" id="zoom-out" aria-label="Zoom out">−</button><button type="button" id="zoom-in" aria-label="Zoom in">+</button><button type="button" id="zoom-planet">Whole planet</button></div></div>
    <p class="hint">Drive with <kbd>W</kbd><kbd>A</kbd><kbd>S</kbd><kbd>D</kbd> or arrows. <kbd>Space</kbd> handbrake, <kbd>C</kbd> camera, scroll to zoom.</p>
  </div>
</details>

<div class="speedo" aria-live="off"><b id="kmh">0</b><small>km/h</small><i id="place">Town</i></div>
<div class="pad" aria-hidden="true">
  <div><button data-k="a">◀</button><button data-k="d">▶</button></div>
  <div><button data-k="s">▼</button><button data-k="w">▲</button></div>
</div>

<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/build/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/loaders/GLTFLoader.js"></script>
<script>
(function(){
const $=s=>document.querySelector(s);
const msg=t=>{const m=$('#msg');m.textContent=t;m.hidden=!t;};
if(!window.THREE||!THREE.GLTFLoader){msg('The 3D library could not load. Check your connection and reload.');return;}
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
const lerp=(a,b,t)=>a+(b-a)*t;
const smooth=(a,b,x)=>{const t=clamp((x-a)/(b-a),0,1);return t*t*(3-2*t);};
function rng(seed){return()=>{seed|=0;seed=seed+0x6D2B79F5|0;let t=Math.imul(seed^seed>>>15,1|seed);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296;};}
const rand=rng(5);
const pick=a=>a[Math.floor(rand()*a.length)];
const range=(a,b)=>a+rand()*(b-a);
const V=(x,y,z)=>new THREE.Vector3(x,y,z);
const N=(x,y,z)=>V(x,y,z).normalize();

/* ---------------- renderer ---------------- */
const canvas=$('#c');
let renderer;
try{renderer=new THREE.WebGLRenderer({canvas,antialias:true});}catch(e){msg('This browser could not start WebGL, so the game cannot run here.');return;}
renderer.setPixelRatio(Math.min(window.devicePixelRatio||1,1.75));
renderer.outputEncoding=THREE.sRGBEncoding;
renderer.shadowMap.enabled=true;
renderer.shadowMap.type=THREE.PCFSoftShadowMap;

const lin=hex=>new THREE.Color(hex).convertSRGBToLinear();
const scene=new THREE.Scene();
scene.background=lin(0xCFE6F5);
const camera=new THREE.PerspectiveCamera(45,1,0.5,3000);
scene.add(new THREE.AmbientLight(lin(0xFFF6EE),0.55));
const sun=new THREE.DirectionalLight(lin(0xFFF3E2),0.95);
sun.castShadow=true;sun.shadow.mapSize.set(2048,2048);
sun.shadow.bias=-0.0004;sun.shadow.normalBias=0.03;
scene.add(sun,sun.target);

/* ---------------- planet plan ---------------- */
const R=65;                      // planet radius in metres (circumference ~410 m)
const RH=3.5,WALK=2;             // road half-width, sidewalk width
const Y_ROAD=0.035,Y_WALK=0.075;
const NORTH=V(0,1,0);
const Z_TOWN=N(0,0.12,1), Z_FARM=N(0,0.15,-1), LAKE=N(0.7,-0.45,0.55), MEADOW=N(-0.7,-0.45,0.55);
const LAKE_R=12;
function circleBasis(n){
  n=n.clone().normalize();
  const a=Math.abs(n.y)<0.9?V(0,1,0):V(1,0,0);
  const u=V(0,0,0).crossVectors(n,a).normalize(),v=V(0,0,0).crossVectors(n,u);
  return{n,u,v};
}
const ROADS=[V(0,1,0),V(1,0.33,0),V(0,0.3,1)].map(circleBasis);
const pointOn=(c,t)=>c.u.clone().multiplyScalar(Math.cos(t)).addScaledVector(c.v,Math.sin(t));
const tangentOn=(c,t)=>c.u.clone().multiplyScalar(-Math.sin(t)).addScaledVector(c.v,Math.cos(t));
const tOf=(c,p)=>Math.atan2(p.dot(c.v),p.dot(c.u));
const crossings=[];
for(let i=0;i<ROADS.length;i++)for(let j=i+1;j<ROADS.length;j++){
  const c=V(0,0,0).crossVectors(ROADS[i].n,ROADS[j].n).normalize();
  crossings.push(c,c.clone().negate());
}
const angTo=(a,b)=>Math.acos(clamp(a.dot(b),-1,1));
const nearCross=(p,metres)=>crossings.some(c=>angTo(p,c)*R<metres);
const roadOffset=(p,c)=>Math.asin(clamp(p.dot(c.n),-1,1))*R;
function roadDist(p){let b=1e9;for(const c of ROADS)b=Math.min(b,Math.abs(roadOffset(p,c)));return b;}
// move a unit point p along tangent direction dir by metres
const offsetP=(p,dir,m)=>p.clone().multiplyScalar(Math.cos(m/R)).addScaledVector(dir,Math.sin(m/R)).normalize();
const tangentToward=(p,target)=>target.clone().addScaledVector(p,-target.dot(p)).normalize();
function randomUnit(){const z=range(-1,1),a=range(0,Math.PI*2),s=Math.sqrt(1-z*z);return V(s*Math.cos(a),z,s*Math.sin(a));}
const randomTangent=p=>V(0,0,0).crossVectors(p,randomUnit()).normalize();

function zoneName(p){
  if(p.y>0.74)return'Snowy north';
  if(p.y<-0.66)return'Autumn woods';
  if(angTo(p,LAKE)*R<LAKE_R+12)return'Lake';
  if(angTo(p,MEADOW)*R<22)return'Flower meadow';
  if(angTo(p,Z_TOWN)*R<55)return'Town';
  if(angTo(p,Z_FARM)*R<50)return'Farm';
  return'Countryside';
}

/* ---------------- orientation helpers ---------------- */
const _m=new THREE.Matrix4(),_q=new THREE.Quaternion(),_p=V(0,0,0),_s=V(0,0,0);
function quatUpFront(up,front){ // local +Y -> up, local +Z -> front
  const y=up.clone().normalize(),z=tangentToward(y,front),x=V(0,0,0).crossVectors(y,z);
  return new THREE.Quaternion().setFromRotationMatrix(new THREE.Matrix4().makeBasis(x,y,z));
}
function quatUpFwdX(up,fwd){ // local +Y -> up, local +X -> fwd (cars)
  const y=up.clone().normalize(),x=tangentToward(y,fwd),z=V(0,0,0).crossVectors(x,y);
  return new THREE.Quaternion().setFromRotationMatrix(new THREE.Matrix4().makeBasis(x,y,z));
}

/* ---------------- occupancy + colliders ---------------- */
const occ=[],colliders=[];
function free(p,r,roadClear=RH+WALK+0.6){
  if(roadDist(p)<r+roadClear)return false;
  for(const o of occ)if(angTo(p,o.p)*R<r+o.r)return false;
  return true;
}
const occupy=(p,r)=>occ.push({p:p.clone(),r});
const collider=(p,r)=>colliders.push({c:p.clone().multiplyScalar(R),r});

/* ---------------- kit placements (instanced) ---------------- */
const placements={};
function place(name,p,front,{h=0,s=1,colors=null,fwdX=false}={}){
  const sc=Array.isArray(s)?s:[s,s,s];
  const q=fwdX?quatUpFwdX(p,front):quatUpFront(p,front);
  (placements[name]||(placements[name]=[])).push({pos:p.clone().multiplyScalar(R+h),q,s:sc,colors});
}
const PAL={
  cherry:{label:'Soft cherry',Body:0xEE8E86,Accent:0xFFC98A},
  peach:{label:'Peach',Body:0xF6AE9E,Accent:0xFFE2B8},
  butter:{label:'Butter',Body:0xFFD88F,Accent:0xF5A99F},
  mint:{label:'Mint',Body:0x9FD8C4,Accent:0xFFF0C2},
  sky:{label:'Sky',Body:0xA2CBEF,Accent:0xFFE3A3},
  lavender:{label:'Lavender',Body:0xC4B5F0,Accent:0xFFE0EA}
};
const lighten=(hex,t)=>new THREE.Color(hex).lerp(new THREE.Color(0xFFFFFF),t).getHex();
const carColors=k=>({Body:PAL[k].Body,Accent:PAL[k].Accent,Fender:lighten(PAL[k].Body,0.25)});
const WALLS=[0xF6EBDD,0xE6EFE2,0xE3ECF6,0xF7E0DA,0xFBF0CF,0xEDE4F4];
const ROOFS=[0xD98C7A,0x8E9CB5,0xB58A73,0x7FA39A,0xC98F9E,0x9C8FB8];
const LEAVES=[0x8BC27A,0x9ACB7F,0x7DB86F,0xA6D08A,0x86BD80,0x8BC27A,0xF2BACB];
const PINES=[0x6FA68C,0x7DB59A,0x679E86];
const AUTUMN=[0xF2B880,0xE9A07A,0xF5CE8A,0xE7A3B0,0xEFC07C];
const SHOPWALLS=[0xF4E2C8,0xE7EEF3,0xF6DCD6,0xE4F0E0];
const AWNINGS=[0x9FD8C4,0xF4A99B,0xA2CBEF,0xFFD88F,0xC4B5F0];
const PETALS=[0xFFB3C7,0xFFE08A,0xFFFFFF,0xC9B8F5,0xFFC4A3];
const CROPS=[0xD9DE8E,0xE8D690,0xB9D486,0xE2C99A];
const TINT=new Set(['Wall','Roof','Leaf','ShopWall','Awning','Body','Accent','Fender','Petal','Rock']);
// sink wide flat-bottomed things so their corners meet the curved ground
const sag=halfDiag=>R-Math.sqrt(R*R-halfDiag*halfDiag);

function tree(p,kind,s,leaf){
  place(kind,p,randomTangent(p),{s,colors:{Leaf:leaf}});
  occupy(p,1.6*s);collider(p,0.35*s);
}

/* ---------------- flat procedural geometry ---------------- */
const acc={};
const A=k=>acc[k]||(acc[k]={pos:[],nor:[],idx:[]});
const FLATMAT={road:[0x7A7F8C,1],line:[0xF6F3EA,.9],walk:[0xD6D1C8,1],water:[0x8FCDE3,.15],lily:[0x8CC279,1]};
function strip(c,t0,t1,o0,o1,h,mk,segLen=1.2){
  // subdivided across too, so wide strips follow the curve instead of cutting under the grass
  const n=Math.max(1,Math.ceil(Math.abs(t1-t0)*R/segLen)),k=Math.max(1,Math.ceil((o1-o0)/1.2)),a=A(mk),base=a.pos.length/3;
  for(let i=0;i<=n;i++){
    const p=pointOn(c,t0+(t1-t0)*i/n);
    for(let j=0;j<=k;j++){
      const o=o0+(o1-o0)*j/k;
      const q=p.clone().multiplyScalar(Math.cos(o/R)).addScaledVector(c.n,Math.sin(o/R)),rr=R+h;
      a.pos.push(q.x*rr,q.y*rr,q.z*rr);a.nor.push(q.x,q.y,q.z);
    }
  }
  for(let i=0;i<n;i++)for(let j=0;j<k;j++){
    const a0=base+i*(k+1)+j,b0=a0+1,a1=a0+k+1,b1=a1+1;a.idx.push(a0,a1,b1,a0,b1,b0);
  }
}
function intervals(c,clear){ // runs of t on road c that stay `clear` metres from any crossing
  const out=[],n=2400;let start=null;
  for(let i=0;i<=n;i++){
    const t=i/n*Math.PI*2,ok=i<n&&!nearCross(pointOn(c,t),clear);
    if(ok&&start===null)start=t;
    if(!ok&&start!==null){out.push([start,t]);start=null;}
  }
  return out;
}
function cap(center,radiusM,h,mk,colorFn){ // spherical cap hugging the planet
  const g=new THREE.SphereGeometry(R+h,40,Math.max(4,Math.ceil(radiusM/1.5)),0,Math.PI*2,0,radiusM/R);
  if(colorFn){
    const pos=g.attributes.position,col=new Float32Array(pos.count*3);
    for(let i=0;i<pos.count;i++){const c=colorFn(pos.getX(i),pos.getZ(i));col[i*3]=c.r;col[i*3+1]=c.g;col[i*3+2]=c.b;}
    g.setAttribute('color',new THREE.BufferAttribute(col,3));
  }
  g.applyMatrix4(new THREE.Matrix4().makeRotationFromQuaternion(new THREE.Quaternion().setFromUnitVectors(NORTH,center.clone().normalize())));
  const m=new THREE.Mesh(g,typeof mk==='string'?flatMat(mk):mk);m.receiveShadow=true;scene.add(m);return m;
}
const FM={};
function flatMat(k){
  if(FM[k])return FM[k];
  const [c,r]=FLATMAT[k];
  return FM[k]=new THREE.MeshStandardMaterial({color:lin(c),roughness:r,metalness:0,polygonOffset:true,polygonOffsetFactor:-1,polygonOffsetUnits:-1});
}
function flushFlat(){
  for(const [k,a] of Object.entries(acc)){
    const g=new THREE.BufferGeometry();
    g.setAttribute('position',new THREE.Float32BufferAttribute(a.pos,3));
    g.setAttribute('normal',new THREE.Float32BufferAttribute(a.nor,3));
    g.setIndex(a.idx);g.computeBoundingSphere();
    const m=new THREE.Mesh(g,flatMat(k));m.receiveShadow=true;scene.add(m);
  }
}

/* ---------------- the planet ---------------- */
function planet(){
  const g=new THREE.SphereGeometry(R,200,150);
  const pos=g.attributes.position,col=new Float32Array(pos.count*3);
  const grassA=lin(0x9CCB81),grassB=lin(0xB2D78F),snow=lin(0xF3F6FA),autumn=lin(0xC7C07E),sand=lin(0xEFDDB2),meadow=lin(0xBBDD8F);
  const p=V(0,0,0),c=new THREE.Color();
  for(let i=0;i<pos.count;i++){
    p.set(pos.getX(i),pos.getY(i),pos.getZ(i)).normalize();
    const n=0.5+0.5*Math.sin(p.x*9+Math.sin(p.y*7)*1.5)*Math.sin(p.z*8+p.x*3);
    c.copy(grassA).lerp(grassB,n*0.8);
    c.lerp(meadow,1-smooth(14,24,angTo(p,MEADOW)*R));
    c.lerp(autumn,smooth(-0.6,-0.7,p.y)*0.8);
    const dl=angTo(p,LAKE)*R;c.lerp(sand,smooth(LAKE_R+5,LAKE_R+2,dl));
    c.lerp(snow,smooth(0.72,0.79,p.y+0.015*Math.sin(p.x*40)*Math.sin(p.z*37)));
    col[i*3]=c.r;col[i*3+1]=c.g;col[i*3+2]=c.b;
  }
  g.setAttribute('color',new THREE.BufferAttribute(col,3));
  const m=new THREE.Mesh(g,new THREE.MeshStandardMaterial({vertexColors:true,roughness:1,metalness:0}));
  m.receiveShadow=true;scene.add(m);
}

function roads(){
  for(const c of ROADS){
    strip(c,0,Math.PI*2,-RH,RH,Y_ROAD,'road',1.5);
    for(const [a,b] of intervals(c,8.5)){strip(c,a,b,RH,RH+WALK,Y_WALK,'walk');strip(c,a,b,-RH-WALK,-RH,Y_WALK,'walk');}
    for(const [a,b] of intervals(c,7)){strip(c,a,b,RH-0.45,RH-0.3,Y_ROAD+0.008,'line');strip(c,a,b,-RH+0.3,-RH+0.45,Y_ROAD+0.008,'line');}
    for(const [a,b] of intervals(c,6))for(let t=a+1/R;t<b-2/R;t+=4/R)strip(c,t,t+2/R,-0.09,0.09,Y_ROAD+0.008,'line',1);
    for(const x of crossings){
      if(Math.abs(x.dot(c.n))>1e-3)continue;
      const tx=tOf(c,x);
      for(const s of [1,-1])for(let o=-RH+0.7;o<=RH-0.6;o+=1.1)strip(c,tx+s*6.6/R,tx+s*8.6/R,o-0.28,o+0.28,Y_ROAD+0.008,'line',1);
    }
  }
}

/* ---------------- town ---------------- */
const HOUSES={House_Cottage:{w:8.4,d:7.2},House_TwoStory:{w:8.8,d:7.6},House_Bungalow:{w:9.6,d:7.0,garage:true}};
function town(){
  const X=crossings.reduce((b,c)=>c.dot(Z_TOWN)>b.dot(Z_TOWN)?c:b);
  // shops around the town crossing
  for(const c of ROADS){
    if(Math.abs(X.dot(c.n))>1e-3)continue;
    const tx=tOf(c,X);
    for(const along of [-26,-15,15,26])for(const s of [1,-1]){
      const p0=pointOn(c,tx+along/R),ps=offsetP(p0,c.n.clone().multiplyScalar(s),RH+WALK+5.6);
      if(roadDist(ps)<RH+WALK+5)continue;
      if(!free(ps,4.8,0))continue;
      place('Shop',ps,c.n.clone().multiplyScalar(-s),{h:-sag(7),colors:{ShopWall:pick(SHOPWALLS),Awning:pick(AWNINGS)}});
      occupy(ps,5.2);collider(ps,5.2);
    }
  }
  // houses along every road near town
  for(const c of ROADS){
    for(let t=0;t<Math.PI*2;t+=16/R){
      const p0=pointOn(c,t);
      if(angTo(p0,Z_TOWN)*R>58||nearCross(p0,12))continue;
      for(const s of [1,-1]){
        const name=pick(Object.keys(HOUSES)),H=HOUSES[name],side=c.n.clone().multiplyScalar(s);
        const ph=offsetP(p0,side,RH+WALK+4.5+H.d/2);
        if(roadDist(ph)<RH+WALK+3.5)continue;
        if(!free(ph,6.4,0))continue;
        const front=side.clone().negate();
        place(name,ph,front,{h:-sag(H.garage?7:5.5),colors:{Wall:pick(WALLS),Roof:pick(ROOFS)}});
        occupy(ph,6.6);collider(ph,Math.max(H.w,H.d)/2);
        if(H.garage){const right=V(0,0,0).crossVectors(ph,front).normalize();collider(offsetP(ph,right,6.4),2.2);}
        const tan=tangentOn(c,t);
        if(rand()<0.5){ // parked car on the driveway side of the house
          const pc=offsetP(offsetP(p0,side,RH+WALK+2.4),tan,s*5.6);
          if(free(pc,1.4,RH+WALK-0.2)){place(rand()<0.6?'Car_Pickup_Static':'Car_Bubble_Static',pc,rand()<0.5?front:side,{fwdX:true,colors:carColors(pick(Object.keys(PAL)))});occupy(pc,1.6);collider(pc,1.5);}
        }
        const pm=offsetP(offsetP(p0,side,RH+WALK+0.7),tan,-s*3);
        place('Mailbox',pm,front);collider(pm,0.2);
        const pt=offsetP(offsetP(ph,side,H.d/2+3.5),tan,range(-4,4));
        if(free(pt,1.6,RH+WALK+1))tree(pt,'Tree_Round',range(0.85,1.15),pick(LEAVES));
        for(const k of [-1,1]){const pb=offsetP(offsetP(ph,front,H.d/2-0.2),tan,k*s*(H.w/2+0.9));if(!H.garage||k*s<0)place('Bush',pb,front,{s:range(0.8,1.1),colors:{Leaf:pick(LEAVES)}});}
      }
    }
    // street lamps through town
    let flip=1;
    for(let t=0;t<Math.PI*2;t+=13/R){
      const p0=pointOn(c,t);
      if(angTo(p0,Z_TOWN)*R>60||nearCross(p0,9))continue;
      flip=-flip;const side=c.n.clone().multiplyScalar(flip),pl=offsetP(p0,side,RH+0.6);
      place('Lamp',pl,side.clone().negate());collider(pl,0.2);
    }
  }
}

/* ---------------- farm, lake, meadow, poles ---------------- */
function farm(){
  let fields=0;
  for(let i=0;i<400&&fields<7;i++){
    const p=offsetP(Z_FARM,randomTangent(Z_FARM),range(6,45)),r=range(6,9);
    if(!free(p,r,RH+WALK+0.8))continue;
    const col=lin(pick(CROPS)),dark=col.clone().multiplyScalar(0.86),rows=rand()<0.5;
    cap(p,r,0.02,new THREE.MeshStandardMaterial({vertexColors:true,roughness:1,polygonOffset:true,polygonOffsetFactor:-1,polygonOffsetUnits:-1}),
      (x,z)=>Math.floor(((rows?x:z)+100)/1.3)%2?col:dark);
    occupy(p,r);fields++;
  }
  for(const [name,r,cr] of [['Barn',8.2,6.4],['Silo',2.4,1.9],['Barn',8.2,6.4],['Silo',2.4,1.9]]){
    for(let i=0;i<300;i++){
      const p=offsetP(Z_FARM,randomTangent(Z_FARM),range(8,50));
      if(!free(p,r,RH+WALK+1))continue;
      place(name,p,randomTangent(p),{h:name==='Barn'?-sag(7.5):0});occupy(p,r);collider(p,cr);break;
    }
  }
}
function lake(){
  cap(LAKE,LAKE_R,0.05,'water');
  for(let i=0;i<7;i++){const p=offsetP(LAKE,randomTangent(LAKE),range(2,LAKE_R-2));cap(p,range(0.35,0.7),0.07,'lily');}
  occupy(LAKE,LAKE_R+2.5);
  for(let k=0;k<5;k++){
    const dir=randomTangent(LAKE),p=offsetP(LAKE,dir,LAKE_R+4);
    if(!free(p,1,RH+WALK+0.5))continue;
    place('Bench',p,tangentToward(p,LAKE));occupy(p,1.2);collider(p,0.7);
  }
}
function meadow(){
  for(let i=0;i<260;i++){
    const p=offsetP(MEADOW,randomTangent(MEADOW),Math.sqrt(rand())*22);
    if(roadDist(p)<RH+WALK+0.4)continue;
    if(occ.some(o=>angTo(p,o.p)*R<o.r))continue;
    place('Flower',p,randomTangent(p),{s:range(0.8,1.3),colors:{Petal:pick(PETALS)}});
  }
  for(let k=0;k<4;k++){const p=offsetP(MEADOW,randomTangent(MEADOW),range(6,16));if(free(p,1.2)){place('Bench',p,tangentToward(p,MEADOW));occupy(p,1.2);collider(p,0.7);}}
}
function poles(){
  let men=0;
  for(let i=0;i<300&&men<6;i++){
    const p=randomUnit();if(p.y<0.82)continue;
    if(!free(p,1.2))continue;
    place('Snowman',p,randomTangent(p));occupy(p,1.5);collider(p,0.6);men++;
  }
  for(let i=0;i<500;i++){
    const p=randomUnit();if(p.y>-0.7)continue;
    if(rand()<0.12&&free(p,1.4)){place('Rock',p,randomTangent(p),{s:range(0.7,1.6),colors:{Rock:pick([0xC9C3D3,0xB8B4C6,0xD4CFC7])}});occupy(p,1.4);collider(p,0.9);}
  }
}
function forests(){
  for(let i=0;i<5000;i++){
    const p=randomUnit();
    const inTown=angTo(p,Z_TOWN)*R<48,inMeadow=angTo(p,MEADOW)*R<24;
    if(inMeadow||(inTown&&rand()<0.85))continue;
    const s=range(0.85,1.35);
    if(!free(p,1.7*s,RH+WALK+1.2))continue;
    if(p.y>0.62)tree(p,'Tree_Pine',s,pick(PINES));
    else if(p.y<-0.6)tree(p,rand()<0.8?'Tree_Round':'Tree_Pine',s,rand()<0.8?pick(AUTUMN):pick(PINES));
    else tree(p,rand()<0.78?'Tree_Round':'Tree_Pine',s,rand()<0.78?pick(LEAVES):pick(PINES));
  }
}

/* ---------------- sky dressing ---------------- */
const clouds=new THREE.Group();scene.add(clouds);
function sky(){
  const cm=new THREE.MeshStandardMaterial({color:lin(0xFFFFFF),roughness:1,emissive:lin(0xFFFFFF),emissiveIntensity:0.35});
  for(let i=0;i<16;i++){
    const p=randomUnit(),g=new THREE.Group();
    for(let k=0;k<4;k++){const b=new THREE.Mesh(new THREE.SphereGeometry(range(2.2,3.6),16,12),cm);b.position.set(k*3.2-4.8,range(0,1),range(-1,1));g.add(b);}
    g.position.copy(p.clone().multiplyScalar(R+range(30,40)));
    g.quaternion.copy(quatUpFront(p,randomTangent(p)));
    clouds.add(g);
  }
  for(const [pos,r,c] of [[V(-420,260,-520),46,0xF6D7E4],[V(560,-180,-300),28,0xFFE7B5],[V(260,420,520),18,0xCFC4F2]]){
    const m=new THREE.Mesh(new THREE.SphereGeometry(r,48,32),new THREE.MeshStandardMaterial({color:lin(c),roughness:1,emissive:lin(c),emissiveIntensity:0.55}));
    m.position.copy(pos);scene.add(m);
  }
}

/* ---------------- kit ---------------- */
let kit;
function extraKit(){
  const mk=(name,parts)=>{const g=new THREE.Group();g.name=name;parts.forEach(m=>g.add(m));kit.add(g);};
  const mat=(name,c,o={})=>Object.assign(new THREE.MeshStandardMaterial(Object.assign({color:lin(c),roughness:0.8},o)),{name});
  const at=(m,x,y,z,sx=1,sy=1,sz=1)=>{m.position.set(x,y,z);m.scale.set(sx,sy,sz);return m;};
  const snow=mat('Snow',0xFBFCFF,{roughness:0.9}),coal=mat('Coal',0x4B4858),carrot=mat('Carrot',0xF7A86A),scarf=mat('Scarf',0xF29A9A);
  const sph=r=>new THREE.SphereGeometry(r,20,14);
  const cone=new THREE.Mesh(new THREE.ConeGeometry(0.07,0.4,12),carrot);cone.rotation.x=Math.PI/2;
  mk('Snowman',[at(new THREE.Mesh(sph(0.62),snow),0,0.5,0),at(new THREE.Mesh(sph(0.45),snow),0,1.25,0),at(new THREE.Mesh(sph(0.32),snow),0,1.85,0),
    at(cone,0,1.86,0.48),at(new THREE.Mesh(sph(0.045),coal),-0.11,1.95,0.28),at(new THREE.Mesh(sph(0.045),coal),0.11,1.95,0.28),
    at(new THREE.Mesh(new THREE.TorusGeometry(0.33,0.08,10,24),scarf),0,1.58,0,1,1,1)]);
  kit.getObjectByName('Snowman').children[6].rotation.x=Math.PI/2;
  const stem=mat('Stem',0x7DB86F),petal=mat('Petal',0xFFB3C7,{roughness:0.6}),eye=mat('FlowerEye',0xFFD36B);
  mk('Flower',[at(new THREE.Mesh(new THREE.CylinderGeometry(0.025,0.03,0.4,6),stem),0,0.2,0),at(new THREE.Mesh(sph(0.16),petal),0,0.44,0,1,0.55,1),at(new THREE.Mesh(sph(0.06),eye),0,0.5,0)]);
  const rock=mat('Rock',0xC9C3D3,{roughness:1,flatShading:true});
  mk('Rock',[at(new THREE.Mesh(new THREE.IcosahedronGeometry(0.9,0),rock),0,0.35,0,1,0.7,1.1),at(new THREE.Mesh(new THREE.IcosahedronGeometry(0.5,0),rock),0.8,0.2,0.3,1,0.8,1)]);
}
function partsOf(name){
  const root=kit.getObjectByName(name);if(!root)return[];
  root.updateMatrixWorld(true);
  const inv=root.matrixWorld.clone().invert(),out=[];
  root.traverse(o=>{if(o.isMesh)out.push({geo:o.geometry,mat:o.material,local:new THREE.Matrix4().multiplyMatrices(inv,o.matrixWorld)});});
  return out;
}
function buildInstances(){
  for(const [name,list] of Object.entries(placements)){
    for(const part of partsOf(name)){
      const tint=TINT.has(part.mat.name),mat=tint?part.mat.clone():part.mat,base=part.mat.color.clone();
      if(tint)mat.color.set(0xFFFFFF);
      const im=new THREE.InstancedMesh(part.geo,mat,list.length);
      im.castShadow=true;im.receiveShadow=true;im.frustumCulled=false;
      list.forEach((p,i)=>{
        _m.compose(p.pos,p.q,_s.set(p.s[0],p.s[1],p.s[2]));_m.multiply(part.local);im.setMatrixAt(i,_m);
        if(tint){const hex=p.colors&&p.colors[part.mat.name];im.setColorAt(i,hex!=null?lin(hex):base);}
      });
      if(im.instanceColor)im.instanceColor.needsUpdate=true;
      scene.add(im);
    }
  }
}

/* ---------------- player truck ---------------- */
const truck=new THREE.Group();scene.add(truck);
let body,wheels=[],tintMats={},tailMat=null;
function makeTruck(){
  const src=kit.getObjectByName('Car_Pickup').clone(true);
  body=new THREE.Group();truck.add(body);
  const wheelNodes=[];
  src.traverse(o=>{if(/Wheel(FL|FR|RL|RR)$/.test(o.name))wheelNodes.push(o);});
  wheelNodes.forEach(w=>w.parent.remove(w));
  body.add(src);
  src.traverse(o=>{
    if(!o.isMesh)return;o.castShadow=true;o.receiveShadow=true;
    const n=o.material.name;
    if(['Body','Accent','Fender','Taillight'].includes(n)){o.material=o.material.clone();(tintMats[n]=tintMats[n]||[]).push(o.material);}
  });
  wheels=wheelNodes.map(w=>{w.traverse(o=>{if(o.isMesh){o.castShadow=true;o.receiveShadow=true;}});w.rotation.order='YXZ';truck.add(w);return{node:w,front:/WheelF/.test(w.name)};});
  tailMat=(tintMats.Taillight||[])[0];
}
function paintTruck(k){const c=carColors(k);for(const n of ['Body','Accent','Fender'])(tintMats[n]||[]).forEach(m=>m.color.copy(lin(c[n])));}

/* ---------------- skid marks ---------------- */
const SKN=700;
const skidGeo=new THREE.PlaneGeometry(0.42,0.18);skidGeo.rotateX(-Math.PI/2);
const skids=new THREE.InstancedMesh(skidGeo,new THREE.MeshBasicMaterial({color:lin(0x4A4858),transparent:true,opacity:0.3,depthWrite:false}),SKN);
skids.frustumCulled=false;
{const z=new THREE.Matrix4().makeScale(0,0,0);for(let i=0;i<SKN;i++)skids.setMatrixAt(i,z);}
scene.add(skids);
let skidI=0;
function addSkid(p,f,h){
  _m.compose(p.clone().multiplyScalar(R+h+0.02),quatUpFwdX(p,f),_s.set(1,1,1));
  skids.setMatrixAt(skidI,_m);skidI=(skidI+1)%SKN;skids.instanceMatrix.needsUpdate=true;
}

/* ---------------- UI ---------------- */
const state={cam:'chase',color:'cherry',zoom:1};
const CAMS={chase:'Chase',top:'Top down'};
function chips(el,map,key,onPick,swatch){
  for(const [k,v] of Object.entries(map)){
    const b=document.createElement('button');b.type='button';b.id=key+'-'+k;
    if(swatch){b.style.background='#'+v.Body.toString(16).padStart(6,'0');b.title=v.label;b.setAttribute('aria-label',v.label);}
    else b.textContent=v;
    b.addEventListener('click',()=>{state[key]=k;sync();onPick&&onPick(k);});
    el.appendChild(b);
  }
}
function sync(){for(const key of ['cam','color'])document.querySelectorAll('#'+key+' button').forEach(b=>b.setAttribute('aria-pressed',String(b.id===key+'-'+state[key])));}
chips($('#cam'),CAMS,'cam');
chips($('#color'),PAL,'color',k=>paintTruck(k),true);
const setZoom=z=>{state.zoom=clamp(z,0.55,7);};
$('#zoom-in').addEventListener('click',()=>setZoom(state.zoom<3?state.zoom/1.25:1));
$('#zoom-out').addEventListener('click',()=>setZoom(state.zoom*1.25));
$('#zoom-planet').addEventListener('click',()=>setZoom(state.zoom>3?1:7));
canvas.addEventListener('wheel',e=>{e.preventDefault();setZoom(state.zoom*Math.exp(e.deltaY*0.0012));},{passive:false});
if(innerWidth<640)$('#panel').open=false;
if(location.hash==='#planet')state.zoom=7;
sync();

const keys={};
const KEYMAP={arrowup:'w',arrowdown:'s',arrowleft:'a',arrowright:'d',w:'w',a:'a',s:'s',d:'d',' ':'hb'};
addEventListener('keydown',e=>{
  if(e.target.closest&&e.target.closest('button')&&e.key===' ')e.target.blur();
  const k=KEYMAP[e.key.toLowerCase()];if(k){keys[k]=true;e.preventDefault();}
  if(e.key.toLowerCase()==='c'){state.cam=state.cam==='chase'?'top':'chase';sync();}
});
addEventListener('keyup',e=>{const k=KEYMAP[e.key.toLowerCase()];if(k)keys[k]=false;});
addEventListener('blur',()=>{for(const k in keys)keys[k]=false;});
document.querySelectorAll('.pad button').forEach(b=>{
  const k=b.dataset.k;
  b.addEventListener('pointerdown',e=>{keys[k]=true;b.setPointerCapture(e.pointerId);e.preventDefault();});
  ['pointerup','pointercancel','lostpointercapture'].forEach(t=>b.addEventListener(t,()=>keys[k]=false));
});

/* ---------------- physics on the sphere ---------------- */
// car.p: unit position, car.f: unit forward tangent. Right = f x p.
const car={p:V(0,0,1),f:V(1,0,0),vf:0,vl:0,steer:0,h:Y_ROAD,spin:0,lastVf:0,pitch:0,roll:0,skidDist:0};
{
  const c=ROADS[0],t=tOf(c,Z_TOWN)-30/R,p0=pointOn(c,t),f=tangentOn(c,t);
  car.f.copy(f);car.p.copy(offsetP(p0,V(0,0,0).crossVectors(f,p0).normalize(),1.75));
}
const MAXF=16,MAXR=6,ACC=9,BRAKE=20,WB=1.9;
const right=()=>V(0,0,0).crossVectors(car.f,car.p).normalize();
function moveAlong(dir,dist){
  if(dist===0)return;
  const axis=V(0,0,0).crossVectors(car.p,dir).normalize();
  const q=new THREE.Quaternion().setFromAxisAngle(axis,dist/R);
  car.p.applyQuaternion(q).normalize();
  car.f.applyQuaternion(q);car.f.addScaledVector(car.p,-car.f.dot(car.p)).normalize();
}
function collide(){
  const P=car.p.clone().multiplyScalar(R);
  for(const off of [0.7,-0.7]){
    const C=P.clone().addScaledVector(car.f,off);
    for(const o of colliders){
      const m=o.r+0.8;
      if(Math.abs(C.x-o.c.x)>m||Math.abs(C.y-o.c.y)>m||Math.abs(C.z-o.c.z)>m)continue;
      const d=C.clone().sub(o.c);d.addScaledVector(car.p,-d.dot(car.p));
      const dist=d.length();
      if(dist>=m||dist<1e-6)continue;
      const n=d.divideScalar(dist);
      moveAlong(n,m-dist);
      const r=right(),v=car.f.clone().multiplyScalar(car.vf).addScaledVector(r,car.vl),vn=v.dot(n);
      if(vn<0){v.addScaledVector(n,-vn*1.3).multiplyScalar(0.8);car.vf=v.dot(car.f);car.vl=v.dot(r);}
      C.copy(car.p).multiplyScalar(R).addScaledVector(car.f,off);
    }
  }
}
function groundH(p){
  let best=1e9;for(const c of ROADS)best=Math.min(best,Math.abs(roadOffset(p,c)));
  if(best<RH)return Y_ROAD;
  if(best<RH+WALK&&!nearCross(p,8.5))return Y_WALK;
  if(best<RH+WALK)return Y_ROAD;
  return angTo(p,LAKE)*R<LAKE_R?-0.12:0;
}
function step(dt){
  const hb=!!keys.hb;let vf=car.vf;
  if(keys.w)vf+=(vf<0?BRAKE:ACC*(1-Math.max(0,vf)/(MAXF*1.15)))*dt;
  else if(keys.s)vf-=(vf>0.3?BRAKE:ACC*0.7)*dt;
  else{vf*=Math.exp(-0.7*dt);vf-=Math.sign(vf)*Math.min(Math.abs(vf),1.2*dt);}
  if(hb)vf-=Math.sign(vf)*Math.min(Math.abs(vf),7*dt);
  const wet=angTo(car.p,LAKE)*R<LAKE_R;
  if(wet)vf*=Math.exp(-2.5*dt);
  car.vf=clamp(vf,-MAXR,MAXF);
  car.vl*=Math.exp(-(hb?1.6:9)*dt);
  const target=((keys.a?1:0)-(keys.d?1:0))*0.62/(1+Math.abs(car.vf)*0.05);
  car.steer+=(target-car.steer)*Math.min(1,dt*9);
  const yaw=car.vf*Math.tan(car.steer)/WB*dt*(hb?1.35:1);
  car.f.applyQuaternion(new THREE.Quaternion().setFromAxisAngle(car.p,yaw)).normalize();
  const r=right(),v=car.f.clone().multiplyScalar(car.vf).addScaledVector(r,car.vl),sp=v.length();
  if(sp>1e-5)moveAlong(v.divideScalar(sp),sp*dt);
  collide();
  car.h+=(groundH(car.p)-car.h)*Math.min(1,dt*14);
  car.spin-=car.vf*dt/0.4;
  const along=(car.vf-car.lastVf)/Math.max(dt,1e-3);car.lastVf=car.vf;
  car.pitch=lerp(car.pitch,clamp(along*0.004,-0.05,0.05),Math.min(1,dt*6));
  car.roll=lerp(car.roll,clamp(car.steer*car.vf*0.012,-0.07,0.07),Math.min(1,dt*6));
  if(tailMat)tailMat.emissiveIntensity=((keys.s&&car.vf>0.3)||hb)?2.2:0.6;
  const slip=Math.abs(car.vl)>2.2||(hb&&Math.abs(car.vf)>4)||(keys.s&&car.vf>9);
  car.skidDist+=sp*dt;
  if(slip&&car.skidDist>0.35&&!wet){
    car.skidDist=0;const r2=right();
    for(const s of [1,-1])addSkid(offsetP(offsetP(car.p,car.f,-0.95),r2,0.62*s),car.f,car.h);
  }
}

/* ---------------- camera ---------------- */
const camF=V(1,0,0);let zoomCur=1,shadowE=0;
function updateCamera(dt,snap){
  const k=snap?1:1-Math.exp(-2.6*dt);
  camF.lerp(car.f,k).addScaledVector(car.p,-camF.dot(car.p)).normalize();
  zoomCur=snap?state.zoom:lerp(zoomCur,state.zoom,1-Math.exp(-4*dt));
  const P=car.p.clone().multiplyScalar(R+car.h),D=30*zoomCur;
  const far=smooth(2.2,6,zoomCur);           // blend toward an overhead planet view when zoomed out
  const top=state.cam==='top'?1:far;
  const back=lerp(D*0.78,0.01,top),up=lerp(D*0.62,D,top);
  camera.position.copy(P).addScaledVector(car.p,up).addScaledVector(camF,-back);
  camera.up.copy(top>0.5?camF:car.p);
  camera.lookAt(P.clone().addScaledVector(camF,lerp(7,0,top)));
  const camR=V(0,0,0).crossVectors(camF,car.p);
  sun.position.copy(P).addScaledVector(car.p,70).addScaledVector(camR,-28).addScaledVector(camF,18);
  sun.target.position.copy(P);
  const e=Math.min(26*zoomCur+14,R*1.4);
  if(Math.abs(e-shadowE)>0.5){shadowE=e;Object.assign(sun.shadow.camera,{left:-e,right:e,top:e,bottom:-e,near:1,far:220});sun.shadow.camera.updateProjectionMatrix();}
}
function resize(){
  const w=innerWidth,h=innerHeight;renderer.setSize(w,h,false);
  camera.aspect=w/h;camera.fov=w<h?60:45;camera.updateProjectionMatrix();
}
addEventListener('resize',resize);resize();

/* ---------------- boot ---------------- */
function buildWorld(){
  extraKit();
  planet();roads();
  lake();town();farm();meadow();poles();forests();
  flushFlat();buildInstances();sky();
  makeTruck();paintTruck(state.color);
}
let last=performance.now(),placeT=0;
const kmh=$('#kmh'),placeEl=$('#place');
function frame(now){
  const dt=Math.min((now-last)/1000,0.05);last=now;
  step(dt);
  truck.position.copy(car.p).multiplyScalar(R+car.h);
  truck.quaternion.copy(quatUpFwdX(car.p,car.f));
  body.rotation.set(car.roll,0,car.pitch);
  body.position.y=Math.abs(car.vf)>0.5?Math.sin(now*0.02)*0.008:0;
  for(const w of wheels){w.node.rotation.y=w.front?car.steer:0;w.node.rotation.z=car.spin;}
  clouds.rotation.y+=dt*0.01;
  updateCamera(dt,false);
  kmh.textContent=Math.round(Math.abs(car.vf)*3.6);
  if((placeT-=dt)<0){placeT=0.5;placeEl.textContent=zoneName(car.p);}
  renderer.render(scene,camera);
  requestAnimationFrame(frame);
}
new THREE.GLTFLoader().load('assets/kit.json',gltf=>{
  kit=gltf.scene;
  try{buildWorld();}catch(e){console.error(e);msg('The planet could not be built: '+e.message);return;}
  msg('');updateCamera(0,true);canvas.focus({preventScroll:true});
  requestAnimationFrame(t=>{last=t;frame(t);});
},undefined,err=>{console.error(err);msg('The planet assets could not load. Open this page through a local web server, not as a file.');});
})();
